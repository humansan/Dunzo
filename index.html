<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/icon-invert2.png" />
    <title>Dunzo</title>

    <!-- The app shell is login-gated and every /app/* URL rewrites to this one file, so
         indexing it would put an unbounded set of thin, identically-described pages in
         front of the marketing site. robots.txt deliberately does NOT Disallow /app —
         Google has to be able to fetch this page to see the noindex. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Dunzo is an intuitive task management app featuring daily focus lists, strategic planner boards, and a gamified XP & streak system designed to eliminate productivity overwhelm." />

    <!-- Link previews. Crawlers do not run JS or follow the client router, so every
         /app/* link shares this one preview; URLs must be absolute. The image is
         served from the marketing build, which owns the domain root. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dunzo" />
    <meta property="og:url" content="https://dunzo.work/app" />
    <meta property="og:title" content="Dunzo" />
    <meta property="og:description" content="An intuitive task manager with daily focus lists, planner boards, and a gamified XP & streak system." />
    <meta property="og:image" content="https://dunzo.work/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dunzo: A calmer way to get things done" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dunzo" />
    <meta name="twitter:description" content="An intuitive task manager with daily focus lists, planner boards, and a gamified XP & streak system." />
    <meta name="twitter:image" content="https://dunzo.work/og.png" />
    <script>
      // Pre-paint theme bootstrap: apply the last-used canvas/fg + dark class before
      // React (and DB settings) load, so a reload never flashes the default theme.
      // The full token set is applied by applyTheme() once AppDataProvider mounts.
      (function () {
        try {
          var b = JSON.parse(localStorage.getItem('theme-boot') || 'null');
          if (!b) return;
          var el = document.documentElement;
          el.classList.toggle('dark', !!b.dark);
          if (b.canvas) { el.style.setProperty('--color-canvas', b.canvas); el.style.backgroundColor = b.canvas; }
          if (b.fg) { el.style.setProperty('--color-fg', b.fg); el.style.color = b.fg; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
